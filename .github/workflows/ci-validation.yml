name: SOLA Monorepo CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Detect Monorepo Path Changes
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      owner: ${{ steps.filter.outputs.owner }}
      customer: ${{ steps.filter.outputs.customer }}
      backend: ${{ steps.filter.outputs.backend }}
      customer_production: ${{ steps.filter.outputs.customer_production }}
      backend_production: ${{ steps.filter.outputs.backend_production }}
      production_config: ${{ steps.filter.outputs.production_config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Validation filters intentionally include workflow/package changes.
            # Production filters below answer a different question: can the
            # deployed artifact or production configuration change?
            admin:
              - 'admin-app/**'
              - '.github/**'
              - 'package.json'
            owner:
              - 'owner-app/**'
              - '.github/**'
              - 'package.json'
            customer:
              - 'customer-app/**'
              - '.github/**'
              - 'package.json'
            backend:
              - 'backend/**'
              - 'docs/api/**'
              - '.github/**'
              - 'package.json'
            # Customer imports this generated CSS directly from DESIGN_SYSTEM.
            # Documentation/source guidance changes do not deploy by themselves.
            customer_production:
              - 'customer-app/**'
              - 'DESIGN_SYSTEM/generated/konfrm-tokens.css'
            backend_production:
              - 'backend/**'
            production_config:
              - 'backend/**'
              - 'scripts/configurePagesEnv.cjs'

  # ----------------------------------------------------------------------------
  # JOB 2: Guard Canonical Repository References
  # ----------------------------------------------------------------------------
  canonical-repository-guard:
    name: Validate Canonical Repository References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard canonical repository identity
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "Essxm01/KONFRM" || {
            echo "CANONICAL_REPOSITORY_MISMATCH: $GITHUB_REPOSITORY"
            exit 1
          }
          legacy_repo="Essxm01/SOLA-""APP"
          if git grep -n -I "$legacy_repo" -- .github/workflows scripts backend; then
            echo "STALE_FUNCTIONAL_REPOSITORY_REFERENCE"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # JOB 3: Validate Admin App
  # ----------------------------------------------------------------------------
  validate-admin:
    name: Validate Admin App
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Admin App
        run: |
          cd admin-app
          npm ci || npm install
          npm run test:login-security
          npm run test:property-review
          npm run build

  # ----------------------------------------------------------------------------
  # JOB 3: Validate Owner App
  # ----------------------------------------------------------------------------
  validate-owner:
    name: Validate Owner App
    needs: changes
    if: ${{ needs.changes.outputs.owner == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, test & build Owner App
        run: |
          cd owner-app
          npm ci || npm install
          npm run test:home
          npm run build

  # ----------------------------------------------------------------------------
  # JOB 4: Validate Customer App
  # ----------------------------------------------------------------------------
  validate-customer:
    name: Validate Customer App
    needs: changes
    if: ${{ needs.changes.outputs.customer == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Customer App
        run: |
          cd customer-app
          npm ci || npm install
          npm run test:truthful-state
          npm run test:entry-state
          npm run test:search-intent
          npm run test:api
          npm run test:c3
          npm run test:c4
          npm run test:explore-redesign
          npm run test:responsive-hardening
          npm run test:auth-screen08
          npm run test:auth-screen09
          npm run test:auth-screen10
          npm run test:screen11
          npm run test:screen12
          npm run test:screen13
          npm run test:screen14
          npm run test:screen15
          npm run test:screen16
          npm run build
      - name: Deploy Customer App to Cloudflare Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.customer_production == 'true' }}
        working-directory: 'customer-app'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=sola-customer-app --branch=main

  # ----------------------------------------------------------------------------
  # JOB 5: Validate Backend API
  # ----------------------------------------------------------------------------
  validate-backend:
    name: Validate Backend API
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: sola_isolated_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & Check Backend
        run: |
          cd backend
          npm ci || npm install
          npm run validate:auth-session-openapi
          npm run check
      - name: Run critical Owner registration and identity tests
        env:
          JWT_ACCESS_SECRET: test_ci_jwt_access_secret_only_for_unit_tests_32ch
          JWT_REFRESH_SECRET: test_ci_jwt_refresh_secret_only_for_unit_tests_32ch
          AUTH_OTP_HMAC_SECRET: test_ci_hmac_secret_for_auth_v2_unit_tests
          ISOLATED_PG_URL: postgresql://postgres:postgrespassword@localhost:5432/sola_isolated_ci_test
        run: |
          cd backend
          npm run test:auth-v2-foundation
          npm run test:auth-v2-postgres
          npm run test:auth-v2-qa-bootstrap
          npm run test:auth-session-openapi
          npm run test:owner-registration-kyc-01
          npm run test:owner-identity-01
          npm run test:owner-property-wizard-01
          npm run test:p13-property-persistence
          npm run test:p13-property-media
          npm run test:p13-worker-adapter
          npm run test:p13-atomic-media
          npm run test:p12-identity-session
          npm run test:p14-rpc-privileges
          npm run test:booking-01
          npm run test:booking-01-1
          npm run test:p1-4-availability
          npm run test:p1-4-worker-availability
          npm run test:p1-4-migration
          npm run test:p1-5-atomic-booking
          npm run test:p1-6-wallet-ledger
          npm run test:p2-1-public-api
          npm run test:p2-2-renter-api
          npm run test:c4-booking
          npm run test:customer-booking-cancel
          npm run test:customer-payment-boundary
          npm run test:auth-p02
          npm run test:p2-3-owner-api
          npm run test:r1-admin-security
          npm run test:p9-1-customer-notifications
      - name: Configure Production Worker Auth V2 Secrets & Pages Env
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.production_config == 'true' }}
        working-directory: 'backend'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set +x
          printf '%s' "123456" | npx wrangler secret put AUTH_DEVELOPMENT_OTP
          HMAC_SECRET="$(echo -n "sola_auth_v2_hmac_secret_2026_${SUPABASE_SECRET_KEY}" | sha256sum | awk '{print $1}')"
          printf '%s' "$HMAC_SECRET" | npx wrangler secret put AUTH_OTP_HMAC_SECRET
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          fi
          # Configure Cloudflare Pages production environment variable
          node ../scripts/configurePagesEnv.cjs || true
      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_production == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'backend'
