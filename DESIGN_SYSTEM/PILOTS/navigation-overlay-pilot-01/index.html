<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KONFRM Phase 4F — Navigation & Overlay System Pilot</title>
  <style>
    @font-face {
      font-family: 'Cairo';
      src: url('./fonts/Cairo-VariableFont.ttf') format('truetype');
      font-weight: 200 900;
      font-style: normal;
    }

    :root {
      /* Typography — Cairo Profile B (4B System-Validated Provisional) */
      --konfrm-font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      --scale-factor: 1;

      /* Foundations */
      --primary-black: #000000;
      --button-primary-radius: 6px; /* Phase 4C PRIMARY_ONLY */
      --field-radius: 8px;          /* Phase 4D Field-shaped controls */
      --struct-container-radius: 12px; /* Phase 4E Structural container provisional */
      --mobile-page-inset: 16px;    /* Phase 4E Page Inset provisional */

      /* Colors */
      --accent-blue: #276EF1;       /* Restrained interaction accent candidate */
      --accent-blue-soft: #EAF1FF;
      --bg-canvas-light: #F8FAFC;
      --bg-surface-white: #FFFFFF;
      --bg-surface-subtle: #F1F5F9;
      --text-main: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border-subtle: #E2E8F0;
      --border-field: #8E8E93;
      --border-divider: #F1F5F9;
      --status-success: #059669;
      --status-success-bg: #ECFDF5;
      --status-pending: var(--accent-blue);
      --status-pending-bg: var(--accent-blue-soft);
      --status-danger: #DC2626;
      --status-danger-bg: #FEF2F2;

      /* Phase 4F Overlay & Navigation Geometry Candidates */
      --sheet-radius: 16px;
      --dialog-radius: 12px;
      --nav-height: 60px;
      --app-bar-height: 56px;
      --sticky-action-height: 72px;
      --safe-area-bottom: 24px;
      --safe-area-top: 44px;
      --overlay-shadow: 0 -4px 24px rgba(15, 23, 42, 0.10);
      --dialog-shadow: 0 12px 36px rgba(15, 23, 42, 0.16);
    }

    /* Scaling support for true 200% text scale tests */
    body.scale-200 { --scale-factor: 2.0; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--konfrm-font-family);
      background-color: #0B1120;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }

    /* Pilot Toolbar (hidden in ?embed=1) */
    header.pilot-bar {
      background: #1E293B;
      border-bottom: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #F8FAFC;
    }

    header.pilot-bar .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header.pilot-bar h1 {
      font-size: calc(16px * var(--scale-factor));
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    header.pilot-bar .badge {
      background: #3B82F6;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .control-label {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
    }

    select, button.btn-ctrl {
      background: #0F172A;
      color: #F8FAFC;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 12px;
      font-family: var(--konfrm-font-family);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    select:focus, button.btn-ctrl:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    /* Main Stage */
    main.stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      overflow-y: auto;
    }

    body.embedded header.pilot-bar {
      display: none;
    }

    body.embedded main.stage {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }

    /* Device Viewport Frame */
    .viewport-frame {
      background: var(--bg-canvas-light);
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 6px solid #1E293B;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: width 0.2s ease, height 0.2s ease;
    }

    body.embedded .viewport-frame {
      border-radius: 0;
      border: none;
      box-shadow: none;
      width: 100% !important;
      height: 100vh !important;
      min-height: 100vh;
    }

    /* Screen Container */
    .screen-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100%;
      position: relative;
      background: var(--bg-canvas-light);
      overflow: hidden;
    }

    /* System Safe-Area Mock Chrome */
    .system-status-bar {
      height: var(--safe-area-top);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-surface-white);
      z-index: 100;
      border-bottom: 1px solid rgba(0, 0, 0, 0.02);
      flex-shrink: 0;
    }

    .system-home-indicator-bar {
      height: var(--safe-area-bottom);
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-surface-white);
      flex-shrink: 0;
      z-index: 100;
    }

    .home-pill {
      width: 134px;
      height: 5px;
      background: #0F172A;
      border-radius: 9999px;
      opacity: 0.8;
    }

    /* Scrollable Content Body */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px var(--mobile-page-inset);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* App Bar Variants */
    .app-bar {
      height: var(--app-bar-height);
      background: var(--bg-surface-white);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--mobile-page-inset);
      position: sticky;
      top: 0;
      z-index: 90;
      flex-shrink: 0;
    }

    .app-bar.top-level {
      justify-content: space-between;
    }

    .app-bar .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-bar .brand-mark {
      width: 28px;
      height: 28px;
      background: #000000;
      color: #FFFFFF;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: -0.04em;
    }

    .app-bar .brand-text {
      font-weight: 800;
      font-size: calc(16px * var(--scale-factor));
      letter-spacing: -0.02em;
    }

    .app-bar .account-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--field-radius);
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: calc(14px * var(--scale-factor));
    }

    .app-bar .back-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--field-radius);
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      font-size: 18px;
      font-weight: 700;
    }

    .app-bar .bar-title {
      font-size: calc(17px * var(--scale-factor));
      font-weight: 700;
      color: var(--text-main);
      flex: 1;
      text-align: right;
      padding-right: 8px;
    }

    .app-bar .bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Customer Bottom Navigation Bar */
    .bottom-nav {
      height: var(--nav-height);
      background: var(--bg-surface-white);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 8px;
      z-index: 95;
      flex-shrink: 0;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
    }

    .nav-tab.active {
      color: var(--accent-blue);
      font-weight: 700;
    }

    .nav-tab .tab-icon {
      font-size: 18px;
      line-height: 1;
    }

    .nav-tab .tab-label {
      font-size: calc(11px * var(--scale-factor));
      line-height: 1.2;
    }

    /* Sticky Bottom Decision Surface */
    .sticky-action-surface {
      background: var(--bg-surface-white);
      border-top: 1px solid var(--border-subtle);
      padding: 12px var(--mobile-page-inset);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 92;
      flex-shrink: 0;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04);
    }

    .price-quote-block {
      display: flex;
      flex-direction: column;
    }

    .price-number {
      font-size: calc(18px * var(--scale-factor));
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .price-sub {
      font-size: calc(12px * var(--scale-factor));
      color: var(--text-muted);
    }

    .btn-primary-action {
      background: var(--primary-black);
      color: #FFFFFF;
      border: none;
      border-radius: var(--button-primary-radius);
      padding: 12px 24px;
      font-family: var(--konfrm-font-family);
      font-size: calc(15px * var(--scale-factor));
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      flex-shrink: 0;
    }

    .btn-secondary-destructive {
      background: transparent;
      color: var(--status-danger);
      border: 1px solid var(--status-danger);
      border-radius: var(--button-primary-radius);
      padding: 12px 18px;
      font-family: var(--konfrm-font-family);
      font-size: calc(14px * var(--scale-factor));
      font-weight: 700;
      cursor: pointer;
    }

    /* Bottom Sheet Modal System */
    .sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .bottom-sheet {
      background: var(--bg-surface-white);
      border-top-left-radius: var(--sheet-radius);
      border-top-right-radius: var(--sheet-radius);
      box-shadow: var(--overlay-shadow);
      display: flex;
      flex-direction: column;
      max-height: 85%;
      overflow: hidden;
      border-top: 1px solid var(--border-subtle);
    }

    .sheet-handle-row {
      display: flex;
      justify-content: center;
      padding: 8px 0 4px;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #CBD5E1;
      border-radius: 9999px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px var(--mobile-page-inset);
      border-bottom: 1px solid var(--border-divider);
    }

    .sheet-title {
      font-size: calc(17px * var(--scale-factor));
      font-weight: 700;
      color: var(--text-main);
    }

    .sheet-close-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--field-radius);
      background: var(--bg-surface-subtle);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .sheet-body {
      padding: 16px var(--mobile-page-inset);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sheet-footer {
      padding: 12px var(--mobile-page-inset);
      border-top: 1px solid var(--border-divider);
      display: flex;
      gap: 12px;
      background: var(--bg-surface-white);
    }

    /* Consequential Confirmation Dialog System */
    .dialog-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .confirmation-dialog {
      background: var(--bg-surface-white);
      border-radius: var(--dialog-radius);
      box-shadow: var(--dialog-shadow);
      border: 1px solid var(--border-subtle);
      width: 100%;
      max-width: 360px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    .dialog-title {
      font-size: calc(17px * var(--scale-factor));
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
    }

    .dialog-body-text {
      font-size: calc(14px * var(--scale-factor));
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .dialog-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .btn-dialog-cancel {
      background: var(--bg-surface-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--button-primary-radius);
      padding: 10px 16px;
      font-family: var(--konfrm-font-family);
      font-size: calc(14px * var(--scale-factor));
      font-weight: 700;
      cursor: pointer;
    }

    .btn-dialog-confirm-danger {
      background: var(--status-danger);
      color: #FFFFFF;
      border: none;
      border-radius: var(--button-primary-radius);
      padding: 10px 16px;
      font-family: var(--konfrm-font-family);
      font-size: calc(14px * var(--scale-factor));
      font-weight: 700;
      cursor: pointer;
    }

    /* Structural Containers (from 4E) */
    .card-container {
      background: var(--bg-surface-white);
      border-radius: var(--struct-container-radius);
      border: 1px solid var(--border-subtle);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .container-title {
      font-size: calc(16px * var(--scale-factor));
      font-weight: 700;
      color: var(--text-main);
    }

    .row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-divider);
    }

    .row-item:last-child {
      border-bottom: none;
    }

    /* Candidate Specific Overrides */
    /* Candidate A: Persistent-First (dual chrome collision in detail) */
    .cand-a-dual-chrome .bottom-nav {
      display: flex !important;
    }

    /* Candidate B: Immersive (aggressive hiding) */
    .cand-b-immersive .app-bar {
      border-bottom: none;
    }

    /* On-Screen Keyboard Mock */
    .keyboard-mock {
      height: 280px;
      background: #D1D5DB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #4B5563;
      font-size: 16px;
      border-top: 1px solid #9CA3AF;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Interactive Pilot Control Header -->
  <header class="pilot-bar">
    <div class="title-group">
      <h1>KONFRM Phase 4F — نظام التنقل والطبقات الإضافية</h1>
      <span class="badge">PILOT 01</span>
      <span class="badge" style="background:#475569;">LAB_SCENARIO_DATA (LAYOUT & PRESENTATION TESTING ONLY)</span>
    </div>

    <div class="controls-group">
      <label class="control-label">النظام المرشح:</label>
      <select id="sel-candidate" onchange="updateView()">
        <option value="C">المرشح C: Role-Aware Contextual (الموصى به)</option>
        <option value="A">المرشح A: Persistence-First (التنقل الدائم)</option>
        <option value="B">المرشح B: Immersive-Hierarchical (فرضية معمارية مستبعدة قبل الاختبار المرئي)</option>
      </select>

      <label class="control-label">الشاشة / التركيب:</label>
      <select id="sel-screen" onchange="updateView()">
        <optgroup label="العميل (Customer)">
          <option value="cust-explore">1. استكشف — المستوى الأعلى (Explore Top-Level)</option>
          <option value="cust-detail">2. تفاصيل الوحدة — المتداخل (Property Detail Nested)</option>
          <option value="cust-sheet">3. ورقة تصفية البحث (Search Filter Bottom Sheet)</option>
          <option value="cust-auth">4. المصادقة الكاملة (Auth V2 Full-Screen Route)</option>
        </optgroup>
        <optgroup label="المالك (Owner)">
          <option value="owner-home">5. لوحة العمليات الأولى (Action-First Home — No Bottom Nav)</option>
          <option value="owner-queue">6. قائمة طلبات الحجز (Bookings Operational Queue)</option>
          <option value="owner-detail">7. تفاصيل الطلب والإجراء (Booking Decision Surface)</option>
          <option value="owner-props">8. إدارة الوحدات والتقويم (Properties & Availability)</option>
          <option value="owner-wallet">9. المحفظة والأرباح (Wallet & Payouts)</option>
          <option value="owner-dialog">10. حوار رفض الطلب (Reject Consequence Dialog)</option>
        </optgroup>
        <optgroup label="لوحة الإدارة (Admin)">
          <option value="admin-queue">11. مراجعة الوحدات المكتبية (Admin 1440 Desktop Boundary)</option>
        </optgroup>
      </select>

      <label class="control-label">إطار العرض:</label>
      <select id="sel-viewport" onchange="updateView()">
        <option value="390">390 × 844 (iPhone 14/15 Baseline)</option>
        <option value="360">360 × 800 (Android Compact)</option>
        <option value="430">430 × 932 (Pro Max Large)</option>
        <option value="1440">1440 × 900 (Admin Desktop)</option>
      </select>

      <label class="control-label">حجم النص:</label>
      <select id="sel-scale" onchange="updateView()">
        <option value="100">100% عادي</option>
        <option value="200">200% تكبير إمكانية الوصول</option>
      </select>

      <label class="control-label">استدارة الشيت:</label>
      <select id="sel-sheet-radius" onchange="updateView()">
        <option value="16">16px (المتوازن الموصى به)</option>
        <option value="12">12px (مطابق للحاويات 4E)</option>
        <option value="20">20px (شديد الانحناء)</option>
      </select>

      <label class="control-label">استدارة الحوار:</label>
      <select id="sel-dialog-radius" onchange="updateView()">
        <option value="12">12px (المتوازن الموصى به)</option>
        <option value="10">10px (بديل متقارب)</option>
        <option value="16">16px (أكثر استدارة)</option>
      </select>

      <button class="btn-ctrl" onclick="toggleStress()">نصوص طويلة</button>
      <button class="btn-ctrl" onclick="toggleKeyboard()">لوحة المفاتيح</button>
    </div>
  </header>

  <!-- Presentation Stage -->
  <main class="stage">
    <div id="viewport-frame" class="viewport-frame" style="width: 390px; height: 844px;">
      <div id="screen-mount" class="screen-root">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <script>
    // State
    const state = {
      candidate: 'C',
      screen: 'cust-explore',
      viewport: 390,
      scale: 100,
      sheetRadius: 16,
      dialogRadius: 12,
      stress: false,
      keyboard: false,
      embed: false
    };

    function parseParams() {
      const p = new URLSearchParams(window.location.search);
      if (p.has('candidate')) state.candidate = p.get('candidate');
      if (p.has('screen')) state.screen = p.get('screen');
      if (p.has('viewport')) state.viewport = parseInt(p.get('viewport'), 10);
      if (p.has('scale')) state.scale = parseInt(p.get('scale'), 10);
      if (p.has('radius')) state.sheetRadius = parseInt(p.get('radius'), 10);
      if (p.has('dialog_radius')) state.dialogRadius = parseInt(p.get('dialog_radius'), 10);
      if (p.has('stress')) state.stress = p.get('stress') === '1';
      if (p.has('keyboard')) state.keyboard = p.get('keyboard') === '1';
      if (p.has('embed')) state.embed = p.get('embed') === '1';

      if (state.embed) document.body.classList.add('embedded');
      if (state.scale === 200) document.body.classList.add('scale-200');

      document.getElementById('sel-candidate').value = state.candidate;
      document.getElementById('sel-screen').value = state.screen;
      document.getElementById('sel-viewport').value = state.viewport;
      document.getElementById('sel-scale').value = state.scale;
      document.getElementById('sel-sheet-radius').value = state.sheetRadius;
      document.getElementById('sel-dialog-radius').value = state.dialogRadius;
    }

    function updateView() {
      state.candidate = document.getElementById('sel-candidate').value;
      state.screen = document.getElementById('sel-screen').value;
      state.viewport = parseInt(document.getElementById('sel-viewport').value, 10);
      state.scale = parseInt(document.getElementById('sel-scale').value, 10);
      state.sheetRadius = parseInt(document.getElementById('sel-sheet-radius').value, 10);
      state.dialogRadius = parseInt(document.getElementById('sel-dialog-radius').value, 10);

      document.documentElement.style.setProperty('--sheet-radius', state.sheetRadius + 'px');
      document.documentElement.style.setProperty('--dialog-radius', state.dialogRadius + 'px');
      if (state.scale === 200) {
        document.body.classList.add('scale-200');
      } else {
        document.body.classList.remove('scale-200');
      }

      const frame = document.getElementById('viewport-frame');
      if (!state.embed) {
        if (state.viewport === 1440) {
          frame.style.width = '1000px';
          frame.style.height = '680px';
        } else {
          frame.style.width = state.viewport + 'px';
