name: Quality Evidence Mesh — CI Safety Baseline (Stage A)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Top-level least privilege: read-only access to repository contents across all jobs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: GitHub Actions Syntax & Expression Validation (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install actionlint v1.7.12
        run: |
          set -euo pipefail
          ACTIONLINT_VER="1.7.12"
          ACTIONLINT_SHA="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ARCHIVE_NAME="actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz"
          
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VER}/${ARCHIVE_NAME}"
          echo "${ACTIONLINT_SHA}  ${ARCHIVE_NAME}" | sha256sum -c -
          tar -xzf "${ARCHIVE_NAME}" actionlint
          chmod +x actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm "${ARCHIVE_NAME}"
          actionlint -version

      - name: Run actionlint
        run: |
          echo "Running actionlint against all tracked GitHub Actions workflows..."
          actionlint -color

  zizmor:
    name: GitHub Actions Security Audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install zizmor 1.30.1
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir zizmor==1.30.1
          zizmor --version

      - name: Run zizmor security audit
        run: |
          echo "Running zizmor offline security audit..."
          zizmor --config .zizmor.yml --offline --format plain .github/workflows
