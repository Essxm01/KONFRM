version: 1.0.0
system: KONFRM Project Context Map V1
purpose: "Direct semantic retrieval of project truth to authoritative source locators. Locators only; zero duplicated Canon."

authoritative_locators:
  business_and_product:
    primary_rules: "docs/BUSINESS_RULES.md"
    master_invariants: "docs/codex/KONFRM_MASTER_RULES.md"
    decision_records: "docs/DECISIONS.md"
    conflicts_log: "docs/codex/KONFRM_DECISION_CONFLICTS.md"

  founder_operating_context:
    document: "docs/codex/KONFRM_FOUNDER_OPERATING_CONTEXT.md"
    targeted_sections:
      autonomy_preference: "docs/codex/KONFRM_FOUNDER_OPERATING_CONTEXT.md#autonomous-execution-mandate"
      explanation_preference: "docs/codex/KONFRM_FOUNDER_OPERATING_CONTEXT.md#communication-standards"
      ux_quality_priority: "docs/codex/KONFRM_FOUNDER_OPERATING_CONTEXT.md#product-and-design-standards"
      evidence_and_trust_model: "docs/codex/KONFRM_FOUNDER_OPERATING_CONTEXT.md#evidence-and-verification"
      prompt_courier_avoidance: "docs/codex/KONFRM_FOUNDER_OPERATING_CONTEXT.md#operational-friction-rules"

  mobile_architecture:
    foundation: "docs/architecture/KONFRM_MOBILE_ARCHITECTURE_FOUNDATION_V1.md"
    boundaries: "docs/architecture/KONFRM_MOBILE_ARCHITECTURE_BOUNDARIES_V1.md"
    topology: "docs/architecture/KONFRM_MOBILE_REPOSITORY_TOPOLOGY_V1.md"
    api_contracts: "docs/architecture/KONFRM_CANONICAL_API_CONTRACT_GOVERNANCE_V1.md"

  design_system_df2:
    audit_report: "DESIGN_SYSTEM/AUDIT_REPORT.md"
    tokens: "DESIGN_SYSTEM/TOKENS/"
    guidelines_rtl: "DESIGN_SYSTEM/GUIDELINES/rtl.md"
    guidelines_accessibility: "DESIGN_SYSTEM/GUIDELINES/accessibility.md"
    guidelines_financial: "DESIGN_SYSTEM/GUIDELINES/financial-display.md"
    guidelines_roles: "DESIGN_SYSTEM/GUIDELINES/roles.md"

  quality_and_governance:
    quality_gates: "AGENTS.md"
    current_state: "docs/CURRENT_STATE.md"
    current_task: "tasks/CURRENT_TASK.md"
    brain_sync_protocol: "docs/BRAIN_SYNC_PROTOCOL.md"
    blueprint_authority: "docs/agents/KONFRM_SKILL_CONSOLIDATION_BLUEPRINT_V1.md"

physical_repository_surface_triggers:
  admin_web:
    paths:
      - "admin-app/**"
    governing_brain: "konfrm-admin-web (Deferred / Web Admin Guidelines)"

  backend_edge:
    paths:
      - "backend/**"
    governing_brain: "konfrm-backend (Deferred / Supabase-Worker Architecture)"

  current_web_apps:
    paths:
      - "customer-app/**"
      - "owner-app/**"
    governing_brain: "React Web (Legacy / Current Web Prototypes)"

  future_mobile:
    paths:
      - "mobile/**"
    governing_brain: "konfrm-flutter (Pilot Active)"

  design_system:
    paths:
      - "DESIGN_SYSTEM/**"
    governing_brain: "konfrm-design (Deferred / DF2 v1.7 Authority)"

  documentation_and_tasks:
    paths:
      - "docs/**"
      - "tasks/**"
    governing_brain: "Context Router / Quality Gate"
