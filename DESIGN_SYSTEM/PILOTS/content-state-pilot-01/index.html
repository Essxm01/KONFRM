<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KONFRM Phase 4G — Content & State Presentation System Pilot</title>
  <style>
    @font-face {
      font-family: 'Cairo';
      src: url('./fonts/Cairo-VariableFont.ttf') format('truetype');
      font-weight: 200 900;
      font-style: normal;
    }

    :root {
      /* Typography — Cairo Profile B (4B System-Validated Provisional) */
      --konfrm-font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      --scale-factor: 1;

      /* Foundations */
      --primary-black: #000000;
      --button-primary-radius: 6px; /* Phase 4C PRIMARY_ONLY */
      --field-radius: 8px;          /* Phase 4D Field-shaped controls */
      --struct-container-radius: 12px; /* Phase 4E Structural container provisional */
      --mobile-page-inset: 16px;    /* Phase 4E Page Inset provisional */

      /* Colors (Exact values are Web pilot references; semantic roles govern) */
      --accent-blue: #276EF1;       /* Restrained interaction accent candidate */
      --accent-blue-soft: #EAF1FF;
      --bg-canvas-light: #F8FAFC;
      --bg-surface-white: #FFFFFF;
      --bg-surface-subtle: #F1F5F9;
      --text-main: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border-subtle: #E2E8F0;
      --border-field: #8E8E93;
      --border-divider: #F1F5F9;

      /* Semantic Status Roles */
      --status-success: #059669;
      --status-success-bg: #ECFDF5;
      --status-success-border: #A7F3D0;
      --status-info: #276EF1;
      --status-info-bg: #EFF6FF;
      --status-info-border: #BFDBFE;
      --status-neutral: #475569;
      --status-neutral-bg: #F8FAFC;
      --status-neutral-border: #E2E8F0;
      --status-danger: #DC2626;
      --status-danger-bg: #FEF2F2;
      --status-danger-border: #FECACA;

      /* Phase 4F Overlay & Navigation Geometry */
      --sheet-radius: 16px;
      --dialog-radius: 12px;
      --nav-height: 60px;
      --app-bar-height: 56px;
      --sticky-action-height: 72px;
      --safe-area-bottom: 24px;
      --safe-area-top: 44px;
      --overlay-shadow: 0 -4px 24px rgba(15, 23, 42, 0.10);
      --dialog-shadow: 0 12px 36px rgba(15, 23, 42, 0.16);
    }

    /* Scaling support for true 200% text scale tests */
    body.scale-200 { --scale-factor: 2.0; }

    body.scale-200 .metric-grid,
    body.scale-200 .stats-grid {
      grid-template-columns: 1fr !important;
    }

    body.scale-200 .action-row,
    body.scale-200 .card-action-bar,
    body.scale-200 .alert-action-row {
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 10px !important;
    }

    body.scale-200 .action-row button,
    body.scale-200 .card-action-bar button,
    body.scale-200 .alert-action-row button {
      width: 100% !important;
    }

    body.scale-200 .app-bar {
      min-height: var(--app-bar-height);
      height: auto !important;
      padding: 8px var(--mobile-page-inset) !important;
      flex-wrap: wrap !important;
      gap: 8px !important;
    }

    body.scale-200 .app-bar .bar-title {
      white-space: normal !important;
      word-break: break-word !important;
    }

    body.scale-200 .table-cell {
      padding: 8px 6px !important;
      font-size: calc(11px * var(--scale-factor)) !important;
    }

    body.scale-200 .toast-box {
      max-width: 90% !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--konfrm-font-family);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #0B0F17;
      color: var(--text-main);
      direction: rtl;
      text-align: right;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Embedded mode when captured by automated screenshot tools */
    body.embedded {
      background-color: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
      display: block !important;
      min-height: 100% !important;
      width: 100% !important;
      overflow-x: hidden !important;
    }

    body.embedded .pilot-toolbar {
      display: none !important;
    }

    body.embedded .viewport-stage {
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      display: block !important;
    }

    body.embedded .viewport-frame {
      box-shadow: none !important;
      border: none !important;
      border-radius: 0 !important;
      margin: 0 auto !important;
      width: 100% !important;
      max-width: 100% !important;
      min-height: 100vh !important;
    }

    /* Pilot Controls Toolbar */
    .pilot-toolbar {
      background: #1E293B;
      color: #F8FAFC;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #334155;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
    }

    .toolbar-select, .toolbar-btn {
      background: #0F172A;
      color: #F8FAFC;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .toolbar-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #FFFFFF;
    }

    /* Viewport Stage */
    .viewport-stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    .viewport-frame {
      background-color: var(--bg-canvas-light);
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
    }

    /* Viewport presets */
    .viewport-frame.vp-360 { width: 360px; min-height: 800px; border-radius: 36px; }
    .viewport-frame.vp-390 { width: 390px; min-height: 844px; border-radius: 40px; }
    .viewport-frame.vp-430 { width: 430px; min-height: 932px; border-radius: 44px; }
    .viewport-frame.vp-1280 { width: 1280px; min-height: 900px; border-radius: 12px; }
    .viewport-frame.vp-1440 { width: 1440px; min-height: 900px; border-radius: 12px; }

    /* Top App Bar */
    .app-bar {
      height: var(--app-bar-height);
      min-height: var(--app-bar-height);
      background-color: var(--bg-surface-white);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--mobile-page-inset);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .app-bar .bar-title {
      font-size: calc(17px * var(--scale-factor));
      font-weight: 700;
      color: var(--text-main);
    }

    .app-bar .bar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-white);
      cursor: pointer;
      color: var(--text-main);
      font-size: calc(14px * var(--scale-factor));
      transition: background 0.15s;
    }

    /* Screen Main Content */
    .screen-content {
      flex: 1;
      padding: var(--mobile-page-inset);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* Customer Bottom Nav Bar (Phase 4F Standard) */
    .customer-bottom-nav {
      height: var(--nav-height);
      background: var(--bg-surface-white);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      position: sticky;
      bottom: 0;
      z-index: 20;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .nav-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: calc(11px * var(--scale-factor));
      font-weight: 600;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 8px;
      position: relative;
    }

    .nav-tab-item.active {
      color: var(--accent-blue);
      font-weight: 700;
    }

    .nav-tab-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-blue);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 10px;
    }

    /* Structural Containers & Cards (Phase 4E Standard: 12px) */
    .struct-card {
      background: var(--bg-surface-white);
      border: 1px solid var(--border-subtle);
      border-radius: var(--struct-container-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    /* Status Badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: calc(12px * var(--scale-factor));
      font-weight: 700;
      line-height: 1.2;
      width: fit-content;
    }

    .status-badge.neutral-process {
      background: #F1F5F9;
      color: #334155;
      border: 1px solid #CBD5E1;
    }

    .status-badge.info {
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
      border: 1px solid #BFDBFE;
    }

    .status-badge.action-required {
      background: #0F172A;
      color: #FFFFFF;
      border: 1px solid #0F172A;
    }

    .status-badge.success {
      background: var(--status-success-bg);
      color: var(--status-success);
      border: 1px solid var(--status-success-border);
    }

    .status-badge.danger {
      background: var(--status-danger-bg);
      color: var(--status-danger);
      border: 1px solid var(--status-danger-border);
    }

    .status-badge.muted {
      background: #F8FAFC;
      color: #64748B;
      border: 1px solid #E2E8F0;
    }

    /* Buttons */
    .btn-primary {
      background: var(--primary-black);
      color: #FFFFFF;
      border: none;
      border-radius: var(--button-primary-radius);
      padding: 10px 18px;
      font-size: calc(14px * var(--scale-factor));
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #1E293B;
    }

    .btn-secondary {
      background: var(--bg-surface-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--button-primary-radius);
      padding: 10px 18px;
      font-size: calc(14px * var(--scale-factor));
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
    }

    .btn-danger-outline {
      background: transparent;
      color: var(--status-danger);
      border: 1px solid var(--status-danger-border);
      border-radius: var(--button-primary-radius);
      padding: 10px 18px;
      font-size: calc(14px * var(--scale-factor));
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
    }

    .btn-disabled {
      background: #E2E8F0 !important;
      color: #94A3B8 !important;
      border: 1px solid #CBD5E1 !important;
      cursor: not-allowed !important;
    }

    /* Skeleton Loading Elements */
    .skeleton-box {
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%;
      animation: skeleton-pulse 1.6s infinite ease-in-out;
      border-radius: 6px;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Screen State Views: Empty, Error, Stale, Conflict */
    .state-screen-box {
      background: var(--bg-surface-white);
      border: 1px solid var(--border-subtle);
      border-radius: var(--struct-container-radius);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      margin: auto 0;
    }

    .state-icon-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .state-icon-circle.neutral { background: #F1F5F9; color: #475569; }
    .state-icon-circle.info { background: #EFF6FF; color: var(--accent-blue); }
    .state-icon-circle.danger { background: #FEF2F2; color: var(--status-danger); }
    .state-icon-circle.success { background: #ECFDF5; color: var(--status-success); }

    .state-title {
      font-size: calc(17px * var(--scale-factor));
      font-weight: 700;
      color: var(--text-main);
    }

    .state-description {
      font-size: calc(13px * var(--scale-factor));
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.55;
      max-width: 320px;
    }

    /* Section Alert Boxes (Founder MR-17 Compliant: No Amber Boxes) */
    .section-alert {
      border-radius: var(--struct-container-radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: calc(13px * var(--scale-factor));
      line-height: 1.5;
    }

    .section-alert.info-stale {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      color: #334155;
    }

    .section-alert.danger-error {
      background: #FEF2F2;
      border: 1px solid var(--status-danger-border);
      color: #991B1B;
    }

    .section-alert.conflict-alert {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      color: #1E3A8A;
    }

    /* Candidate Variations Styling */
    /* Candidate A: Badge-Centric (Heavy pills) */
    body.cand-a .candidate-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    body.cand-a .candidate-badge-row .status-badge {
      padding: 6px 12px;
      font-size: calc(13px * var(--scale-factor));
      border-radius: 9999px;
    }

    /* Candidate B: Message-Centric (Every status has a boxed banner) */
    body.cand-b .candidate-box-banner {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    /* Candidate C: Role-Aware Layered (Clean, disciplined) */
    body.cand-c .layered-process-text {
      color: var(--text-secondary);
      font-size: calc(13px * var(--scale-factor));
      font-weight: 500;
    }

    /* Admin Table Styling */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: calc(13px * var(--scale-factor));
      background: #FFFFFF;
      border-radius: var(--struct-container-radius);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .admin-table th {
      background: #F8FAFC;
      padding: 12px 14px;
      font-weight: 700;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
      text-align: right;
    }

    .admin-table td {
      padding: 14px;
      border-bottom: 1px solid var(--border-divider);
      color: var(--text-main);
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    /* Toast Notification (Candidate C: Transient Confirmation Only) */
    .toast-overlay {
      position: absolute;
      bottom: calc(var(--nav-height) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 16px;
    }

    .toast-box {
      background: #0F172A;
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: calc(13px * var(--scale-factor));
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="cand-c" id="pilot-body">

  <!-- Interactive Controls Toolbar (Hidden in automated screenshots) -->
  <div class="pilot-toolbar">
    <div class="toolbar-group">
      <span class="toolbar-label">الدور:</span>
      <select id="role-select" class="toolbar-select" onchange="onRoleChange()">
        <option value="customer">Customer (الضيف)</option>
        <option value="owner">Owner (المالك)</option>
        <option value="admin">Admin (الإدارة)</option>
      </select>

      <span class="toolbar-label">الحالة المعروضة:</span>
      <select id="state-select" class="toolbar-select" onchange="onStateChange()">
        <!-- Populated dynamically based on role -->
      </select>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-label">النظام المرشح:</span>
      <button class="toolbar-btn" id="btn-cand-a" onclick="setCandidate('cand-a')">A: شارات فقط</button>
      <button class="toolbar-btn" id="btn-cand-b" onclick="setCandidate('cand-b')">B: رسائل معلبة</button>
      <button class="toolbar-btn active" id="btn-cand-c" onclick="setCandidate('cand-c')">C: نظام طبقي واعي (المقترح)</button>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-label">العرض:</span>
      <button class="toolbar-btn" id="vp-360-btn" onclick="setViewport('360')">360px</button>
      <button class="toolbar-btn active" id="vp-390-btn" onclick="setViewport('390')">390px</button>
      <button class="toolbar-btn" id="vp-430-btn" onclick="setViewport('430')">430px</button>
      <button class="toolbar-btn" id="vp-1280-btn" onclick="setViewport('1280')">1280px</button>
      <button class="toolbar-btn" id="vp-1440-btn" onclick="setViewport('1440')">1440px</button>

      <span class="toolbar-label">الخط:</span>
      <button class="toolbar-btn active" id="scale-100-btn" onclick="setScale(100)">100%</button>
      <button class="toolbar-btn" id="scale-200-btn" onclick="setScale(200)">200%</button>
    </div>
  </div>

  <!-- Viewport Stage -->
  <div class="viewport-stage">
    <div class="viewport-frame vp-390" id="viewport-frame">
      <!-- Container rendered dynamically by JavaScript -->
      <div id="app-container" style="display:flex; flex-direction:column; min-height:100%; width:100%;"></div>
    </div>
  </div>

  <script>
    // State Options per Role
    const roleStates = {
      customer: [
        { id: 'cust-explore-loading', label: 'Explore: تحميل هيكلي (Skeleton)' },
        { id: 'cust-explore-empty', label: 'Explore: بحث صفر نتائج (Zero Search Matches)' },
        { id: 'cust-explore-error', label: 'Explore: خطأ شبكة/خادم (Error with Retry)' },
        { id: 'cust-explore-stale', label: 'Explore: بيانات صالحة غير محدثة (Stale Safe Data)' },
        { id: 'cust-favorites-empty', label: 'Favorites: قائمة مفضلة فارغة (True Empty)' },
        { id: 'cust-bookings-guest', label: 'Bookings: مستخدم غير مسجل (Guest State)' },
        { id: 'cust-bookings-empty', label: 'Bookings: لا توجد حجوزات (True Empty)' },
        { id: 'cust-bookings-expired', label: 'Bookings: انتهاء الجلسة (Session Expired - No Amber)' },
        { id: 'cust-bookings-pending', label: 'Bookings: بانتظار موافقة المالك (Normal Process)' },
        { id: 'cust-bookings-approved', label: 'Bookings: مطلوب سداد العربون (Action Required)' },
        { id: 'cust-bookings-confirmed', label: 'Bookings: حجز مؤكد (Stable Success)' },
        { id: 'cust-booking-conflict', label: 'Detail/Review: تعارض وتغير السعر (Price Conflict)' },
        { id: 'cust-booking-submitting', label: 'Checkout: إرسال الطلب قيد التنفيذ (Submitting)' },
        { id: 'cust-booking-success', label: 'Screen 11: تم إرسال الطلب بنجاح (Request Sent Success)' }
      ],
      owner: [
        { id: 'owner-home-loading', label: 'Home: تحميل هيكلي للمؤشرات (Skeleton)' },
        { id: 'owner-home-empty', label: 'Home: لا توجد طلبات تحتاج قرارك (Clean Empty)' },
        { id: 'owner-home-partial', label: 'Home: فشل جزئي لقسم المحفظة (Partial Failure)' },
        { id: 'owner-bookings-queue', label: 'Bookings: طلب حجز جديد بانتظار القرار (Queue Item)' },
        { id: 'owner-bookings-submitting', label: 'Bookings: تسجيل القرار قيد التنفيذ (Submitting)' },
        { id: 'owner-properties-empty', label: 'Properties: لا توجد وحدات مسجلة (First-Run Empty)' },
        { id: 'owner-properties-review', label: 'Properties: وحدة قيد المراجعة (Normal Process)' },
        { id: 'owner-wallet-loaded', label: 'Wallet: رصيد متاح ومعلق (24h Canon Distinct)' },
        { id: 'owner-wallet-error', label: 'Wallet: خطأ تحميل الأرصدة (Scoped Error)' },
        { id: 'owner-wallet-disabled', label: 'Wallet: زر السحب غير نشط (Disabled with Reason)' }
      ],
      admin: [
        { id: 'admin-overview-loading', label: 'Overview: تحميل المؤشرات التشغيلية (Skeleton)' },
        { id: 'admin-overview-error', label: 'Overview: خطأ تحميل بدون أرقام صفرية زائفة (Truthful Error)' },
        { id: 'admin-queue-empty', label: 'Queue: قائمة مراجعة مكتملة (Clean Empty Queue)' },
        { id: 'admin-queue-error', label: 'Queue: خطأ جلب قاعدة البيانات (Table Error with Retry)' },
        { id: 'admin-queue-loaded', label: 'Queue: جدول مراجعة الوحدات (Active Review Items)' },
        { id: 'admin-session-expired', label: 'Session: انتهاء جلسة الإدارة (Unauthorized Gate)' }
      ]
    };

    let currentRole = 'customer';
    let currentState = 'cust-explore-loading';
    let currentCandidate = 'cand-c';
    let currentViewport = '390';
    let currentScale = 100;

    function init() {
      // Parse URL parameters for automated test harness
      const params = new URLSearchParams(window.location.search);
      if (params.get('embedded') === 'true') {
        document.body.classList.add('embedded');
      }
      if (params.get('role')) {
        currentRole = params.get('role');
        document.getElementById('role-select').value = currentRole;
      }
      if (params.get('candidate')) {
        setCandidate(params.get('candidate'));
      }
      if (params.get('viewport')) {
        setViewport(params.get('viewport'));
      }
      if (params.get('scale') === '200') {
        setScale(200);
      }

      populateStateSelect();

      if (params.get('state')) {
        currentState = params.get('state');
        document.getElementById('state-select').value = currentState;
      }

      renderCurrentView();
    }

    function onRoleChange() {
      currentRole = document.getElementById('role-select').value;
      if (currentRole === 'admin') {
        setViewport('1440');
      } else if (currentViewport === '1280' || currentViewport === '1440') {
        setViewport('390');
      }
      populateStateSelect();
      currentState = roleStates[currentRole][0].id;
      renderCurrentView();
    }

    function onStateChange() {
      currentState = document.getElementById('state-select').value;
      renderCurrentView();
    }

    function populateStateSelect() {
      const select = document.getElementById('state-select');
      select.innerHTML = '';
      roleStates[currentRole].forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.label;
        select.appendChild(opt);
      });
      currentState = roleStates[currentRole][0].id;
    }

    function setCandidate(cand) {
      currentCandidate = cand;
      document.body.className = document.body.className.replace(/cand-[abc]/g, '');
      document.body.classList.add(cand);
      ['btn-cand-a', 'btn-cand-b', 'btn-cand-c'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      document.getElementById('btn-' + cand).classList.add('active');
      renderCurrentView();
    }

    function setViewport(vp) {
      currentViewport = vp;
      const frame = document.getElementById('viewport-frame');
      frame.className = frame.className.replace(/vp-\d+/g, '');
      frame.classList.add('vp-' + vp);
      ['vp-360-btn', 'vp-390-btn', 'vp-430-btn', 'vp-1280-btn', 'vp-1440-btn'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      document.getElementById('vp-' + vp + '-btn').classList.add('active');
    }

    function setScale(scale) {
      currentScale = scale;
      if (scale === 200) {
        document.body.classList.add('scale-200');
        document.getElementById('scale-200-btn').classList.add('active');
        document.getElementById('scale-100-btn').classList.remove('active');
      } else {
        document.body.classList.remove('scale-200');
        document.getElementById('scale-100-btn').classList.add('active');
        document.getElementById('scale-200-btn').classList.remove('active');
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      switch (currentState) {
        // Customer Explore Views
        case 'cust-explore-loading':
